version: '3.8'

services:
  rabbitmq:
    build: .
    image: roomee-rabbitmq:latest
    container_name: roomee-rabbitmq
    ports:
      - '5673:5672' # AMQP (port local 5673 pour éviter conflit)
      - '15673:15672' # Management UI (port local 15673)
      # - '5671:5671' # AMQP SSL (désactivé pour dev local)
    environment:
      - RABBITMQ_DEFAULT_USER=roomee_admin
      - RABBITMQ_DEFAULT_PASS=R00m33_@MQP_2024!
      - RABBITMQ_DEFAULT_VHOST=/
    # Volumes persistants en local (optionnel si tu veux repartir propre)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_log:/var/log/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  rabbitmq_data:
    driver: local
  rabbitmq_log:
    driver: local
