version: '3.8'

services:
  rabbitmq:
    build: .
    container_name: roomee-rabbitmq
    ports:
      - "5673:5672"   # AMQP
      - "15673:15672" # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=roomee_admin
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_log:/var/log/rabbitmq
    networks:
      - roomee-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  rabbitmq_data:
    driver: local
  rabbitmq_log:
    driver: local

networks:
  roomee-network:
    driver: bridge